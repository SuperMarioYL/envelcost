[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "envelcost"
version = "0.1.0"
description = "Per-harness DeepSeek tool-call-envelope token-cost profiler for 信创 on-prem GPU capacity planning."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = [
  "deepseek",
  "token-cost",
  "capacity-planning",
  "coding-agent",
  "envelope",
  "on-prem",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tiktoken>=0.7.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# The DeepSeek-native BPE tokenizer (transformers). Heavy (pulls torch). The
# core `envelcost run`/`project` path is fully reproducible without it via the
# deterministic fallback in envelcost.tokenizer; install this extra only to use
# the real DeepSeek vocab for absolute token counts.
deepseek = ["transformers>=4.44.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
]

[project.scripts]
envelcost = "envelcost.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/envelcost"
Repository = "https://github.com/SuperMarioYL/envelcost"
Issues = "https://github.com/SuperMarioYL/envelcost/issues"

[tool.hatch.build.targets.wheel]
packages = ["envelcost"]

[tool.hatch.build.targets.wheel.force-include]
"envelcost/tasks" = "envelcost/tasks"

[tool.hatch.build.targets.sdist]
include = [
  "/envelcost",
  "/tests",
  "/docs",
  "/assets",
  "/examples",
  "README.md",
  "README.en.md",
  "LICENSE",
  "VERSION",
  "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "envelcost"
version = "0.9.0"
description = "Compare serialized tool-envelope token estimates and project their ratios through an explicit capacity-planning model."
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "SuperMarioYL" }]
keywords = [
  "deepseek",
  "token-cost",
  "capacity-planning",
  "coding-agent",
  "envelope",
  "on-prem",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "typer>=0.12.0",
  "httpx>=0.27.0",
  "tiktoken>=0.7.0",
  "rich>=13.7.0",
  "jinja2>=3.1.0",
  "pyyaml>=6.0.1",
]

[project.optional-dependencies]
# The DeepSeek-native BPE tokenizer (transformers). Heavy (pulls torch). The
# core `envelcost run`/`project` path is fully reproducible without it via the
# deterministic fallback in envelcost.tokenizer; install this extra only to use
# the real DeepSeek vocab for absolute token counts.
deepseek = ["transformers>=4.44.0"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  # The wheel-build regression test drives hatchling's WheelBuilder in-process
  # (the same builder `python -m build` invokes in release.yml), so the
  # artifact-producing path is exercised on every CI run.
  "hatchling>=1.21",
]

[project.scripts]
envelcost = "envelcost.cli:app"

[project.urls]
Homepage = "https://github.com/SuperMarioYL/envelcost"
Repository = "https://github.com/SuperMarioYL/envelcost"
Issues = "https://github.com/SuperMarioYL/envelcost/issues"

[tool.hatch.build.targets.wheel]
# `packages` alone carries the whole package tree into the wheel, including
# envelcost/tasks/swe-bench-mini.yaml. A force-include of "envelcost/tasks"
# used to sit here as well, which made hatchling add the same file to the
# archive twice and hard-fail every wheel build ("A second file is being added
# to the wheel archive at the same path") — release.yml's `python -m build`
# failed on every tag from v0.1.0 through v0.8.0 because of it
# (fix-wheel-build-duplicate-tasks-include). Do not re-add it.
packages = ["envelcost"]

[tool.hatch.build.targets.sdist]
include = [
  "/envelcost",
  "/tests",
  "/docs",
  "/assets",
  "/examples",
  "README.md",
  "README.en.md",
  "LICENSE",
  "VERSION",
  "pyproject.toml",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
  "ignore::DeprecationWarning",
]

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="880" height="360"
     font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif"
     role="img" aria-label="Architecture: CLI→Runner→DeepSeek API→EnvelopeProfile store→Reporter/Projector">
  <defs>
    <marker id="ah-d" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L6,3 L0,6 Z" fill="#5A5A66"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="880" height="360" fill="#1D1D1F"/>

  <!-- static base connectors -->
  <g stroke="#3A3A44" stroke-width="1.5" fill="none">
    <line x1="155" y1="180" x2="185" y2="180" marker-end="url(#ah-d)"/>
    <line x1="315" y1="180" x2="345" y2="180" marker-end="url(#ah-d)"/>
    <line x1="475" y1="180" x2="505" y2="180" marker-end="url(#ah-d)"/>
    <line x1="635" y1="180" x2="678" y2="118" marker-end="url(#ah-d)"/>
    <line x1="635" y1="180" x2="678" y2="242" marker-end="url(#ah-d)"/>
  </g>

  <!-- marching-dash data flow (identical dur/begin/dasharray to light variant) -->
  <g stroke-width="1.5" fill="none" stroke-linecap="round">
    <line x1="155" y1="180" x2="181" y2="180" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" repeatCount="indefinite"/>
    </line>
    <line x1="315" y1="180" x2="341" y2="180" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.32s" repeatCount="indefinite"/>
    </line>
    <line x1="475" y1="180" x2="501" y2="180" stroke="#2DC79A" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.64s" repeatCount="indefinite"/>
    </line>
    <line x1="635" y1="180" x2="674" y2="120" stroke="#8985FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-0.96s" repeatCount="indefinite"/>
    </line>
    <line x1="635" y1="180" x2="674" y2="240" stroke="#4DA3FF" stroke-opacity="0.5" stroke-dasharray="6 10">
      <animate attributeName="stroke-dashoffset" from="32" to="0" dur="1.6s" begin="-1.28s" repeatCount="indefinite"/>
    </line>
  </g>

  <!-- animateMotion packet dots (identical path/dur/begin to light variant) -->
  <g>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M155,180 L181,180" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M315,180 L341,180" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.6s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#2DC79A">
      <animateMotion path="M475,180 L501,180" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.2s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#8985FF">
      <animateMotion path="M635,180 L674,120" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-1.8s" repeatCount="indefinite"/>
    </circle>
    <circle r="3" fill="#4DA3FF">
      <animateMotion path="M635,180 L674,240" dur="2.4s" begin="-0.3s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0;1;1;0" keyTimes="0;0.15;0.85;1" dur="2.4s" begin="-0.3s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- nodes: breathing, identical dur/begin to light variant -->
  <g font-size="13" font-weight="600">
    <rect x="25" y="145" width="130" height="70" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="90" y="178" text-anchor="middle" fill="#F5F5F7">CLI</text>
    <text x="90" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">typer</text>

    <rect x="185" y="145" width="130" height="70" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-0.8s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="250" y="178" text-anchor="middle" fill="#F5F5F7">Runner</text>
    <text x="250" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">N envelope configs</text>

    <rect x="345" y="145" width="130" height="70" rx="14" fill="#2DC79A" fill-opacity="0.16" stroke="#2DC79A" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-1.6s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="410" y="178" text-anchor="middle" fill="#F5F5F7">DeepSeek API</text>
    <text x="410" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">httpx · usage</text>

    <rect x="505" y="145" width="130" height="70" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5">
      <animate attributeName="fill-opacity" values="0.10;0.18;0.10" keyTimes="0;0.5;1" dur="3.2s" begin="-2.4s" calcMode="spline" keySplines="0.4 0 0.6 1;0.4 0 0.6 1" repeatCount="indefinite"/>
    </rect>
    <text x="570" y="178" text-anchor="middle" fill="#F5F5F7">EnvelopeProfile</text>
    <text x="570" y="196" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">.envelcost/ store</text>

    <rect x="680" y="90" width="140" height="58" rx="14" fill="#8985FF" fill-opacity="0.16" stroke="#8985FF" stroke-width="1.5"/>
    <text x="750" y="116" text-anchor="middle" fill="#F5F5F7">Reporter</text>
    <text x="750" y="132" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">jinja2 → JSON/MD</text>

    <rect x="680" y="212" width="140" height="58" rx="14" fill="#4DA3FF" fill-opacity="0.16" stroke="#4DA3FF" stroke-width="1.5"/>
    <text x="750" y="238" text-anchor="middle" fill="#F5F5F7">Projector</text>
    <text x="750" y="254" text-anchor="middle" font-size="10" font-weight="500" fill="#A1A1A8">multiplier → GPU</text>
  </g>

  <text x="440" y="335" text-anchor="middle" font-size="11" font-weight="500" fill="#A1A1A8">one binary · one process · state is JSON under .envelcost/ · no DB · no K8s</text>
</svg>

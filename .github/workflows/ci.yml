name: ci
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        run: pip install --upgrade uv
      - name: Sync project (core deps only — transformers is opt-in)
        run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -q
      - name: Smoke-test the CLI happy path
        run: |
          uv run envelcost --version
          uv run envelcost run
          uv run envelcost project --gpus 8xH100 --seats 50

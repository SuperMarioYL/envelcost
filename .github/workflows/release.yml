name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheel + sdist into dist/
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Generate sha256 checksums
        run: |
          cd dist
          sha256sum * | tee checksums.txt
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/*
  # PyPI publishing is OPT-IN. A fresh repo has no Trusted Publisher registered,
  # so an always-on job would fail the FIRST release with `invalid-publisher`.
  # Set the repo variable PYPI_PUBLISH=true and register the Trusted Publisher
  # (https://docs.pypi.org/trusted-publishers/) when you actually want to ship.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && vars.PYPI_PUBLISH == 'true'
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist
      - uses: pypa/gh-action-pypi-publish@release/v1
